[pbs.mail]
types = ['a', 'b', 'e', 'ab', 'ae', 'ba', 'be', 'ea', 'eb', 'abe', 'aeb', 'bae', 'bea', 'eab', 'eba']
options = "-M {email} -m {mailtype}"
